name: cache-regression
on:
  workflow_dispatch:
  push:
    branches: [validation/app-list-cache]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache regression tests
        run: cargo test --locked --no-default-features --features cli backend::app_lister::cache_tests -- --nocapture
