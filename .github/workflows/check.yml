name: cache-regression
on:
  workflow_dispatch:
  push:
    branches: [validation/app-list-cache]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache regression tests
        run: cargo test --locked --no-default-features --features cli backend::app_lister::cache_tests -- --nocapture
      - name: Build Windows CLI for a local smoke test
        if: matrix.os == 'windows-latest'
        run: cargo build --locked --no-default-features --features cli
      - name: Upload Windows CLI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cache-test-windows-cli
          path: target/debug/samrewritten.exe
